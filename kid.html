<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private calendar login — Eva &amp; Gabe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/themes.css">
</head>
<body>
  <main class="kid-login">
    <p class="eyebrow"><a href="/">Back to Eva &amp; Gabe</a></p>
    <h1 id="kid-heading">Private calendar</h1>
    <p id="kid-status" class="form-status" role="status">Checking your private link…</p>
    <div id="kid-app" hidden>
      <p class="card-sub">You can add, edit, or remove only your own events. They also show up on your public tab.</p>
      <form class="event-editor card" id="add-event-form">
        <h2>Add an event</h2>
        <div class="field">
          <label for="event-date">Date</label>
          <input type="date" id="event-date" name="date" required>
        </div>
        <div class="field">
          <label for="event-time">Time (optional)</label>
          <input type="text" id="event-time" name="time" maxlength="40" placeholder="4:00 PM">
        </div>
        <div class="field">
          <label for="event-title">Title</label>
          <input type="text" id="event-title" name="title" maxlength="160" required>
        </div>
        <div class="field">
          <label for="event-note">Note (optional)</label>
          <textarea id="event-note" name="note" rows="2" maxlength="400"></textarea>
        </div>
        <button type="submit" class="btn">Save event</button>
      </form>
      <h2>Your events</h2>
      <ul class="kid-event-list" id="kid-event-list"></ul>
    </div>
  </main>
  <script src="/kid.js"></script>
</body>
</html>
